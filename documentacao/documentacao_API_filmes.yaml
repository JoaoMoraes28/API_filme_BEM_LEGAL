components:
  schemas:
    filmePost:
      required:
        - nome
        - data_lancamento
        - duracao
        - orcamento
        - capa
        - genero
        - elenco
        - classificacao
      type: object
      properties:
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
          format: date
        duracao:
          type: string
        orcamento:
          type: number
          format: double
        trailer:
          type: string
        capa:
          type: string
        genero:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        elenco:
          type: array
          items:
            type: object
            properties:
              id_ator:
                type: integer
        classificacao:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer        
            
    filmeGet:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
          format: date
        duracao:
          type: string
        orcamento:
          type: number
          format: double
        trailer:
          type: string
        capa:
          type: string
        genero:
          type: array
          items:
            type: object
            properties:
              genero:
                type: string
        elenco:
          type: array
          items:
            type: object
            properties:
              ator:
                type: string
        classificacao:
          type: array
          items:
            type: object
            properties:
              classificacao_indicativa:
                type: string  
          
    filmePut:
      required:
        - nome
        - data_lancamento
        - duracao
        - orcamento
        - capa
        - elenco
        - genero
        - classificacao
      type: object
      properties:
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
          format: date
        duracao:
          type: string
        orcamento:
          type: number
          format: double
        trailer:
          type: string
        capa:
          type: string
        genero:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        elenco:
          type: array
          items:
            type: object
            properties:
              id_ator:
                type: integer
        classificacao:
          type: array
          items:
            type: object
            properties:
              classificacao:
                type: integer     
          
    idiomaGet:
      type: object
      properties:
        id:
          type: integer
        idioma:
          type: string
          
    idiomaPost:
      required:
        - idioma
      type: object
      properties:
        idioma:
          type: string      
          
          
    generoGet:
      type: object
      properties:
        id:
          type: integer
        genero:
          type: string
          
    generoPost:
      required:
        - genero
      type: object
      properties:
        genero:
          type: string  
          
    paisGet:
      type: object
      properties:
        id:
          type: integer
        pais:
          type: string
    
    paisPost:
      required:
        - pais
      type: object
      properties:
        id:
          type: integer
        pais:
          type: string
          
    clasGet:
      type: object
      properties:
        id:
          type: integer
        classificacao:
          type: string
          
    clasPost:
      required:
        - classificacao
      type: object
      properties:
        id:
          type: integer
        classificacao:
          type: string 

    atorPost:
      required:
        - nome
        - data_nascimento
        - nacionalidade
        - idade
        - ativo
      type: object
      properties:
        nome:
          type: string
        data_nascimento:
          type: string
          format: date
        nacionalidade:
          type: integer
        idade:
          type: integer
        ativo:
          type: integer

    atorGet:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        data_nascimento:
          type: string
          format: date
        nacionalidade:
          type: string
        idade:
          type: integer
        ativo:
          type: integer

    diretorPost:
      required:
        - nome
        - data_nascimento
        - nacionalidade
        - idade
        - ativo
      type: object
      properties:
        nome:
          type: string
