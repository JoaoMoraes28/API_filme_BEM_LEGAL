  /v1/locadora/filme:
    post:
      tags:
        - Filmes
      summary: Adiciona um novo filme
      description: Adiciona um novo filme
      requestBody:
        description: JSON contendo os dados do novo filme deve ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filmePost'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
    get:
      tags:
        - Filmes
      summary: Lista todos os filmes
      description: Listagem de todos os filmes registrados no sistema
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/filmeGet'          
           
        '404':
          description: Not Found
  /v1/locadora/filme/{id}:
    get:
      tags:
        - Filmes
      summary: Lista um filme 
      description: Retorna um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID do filme para retorno
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filmeGet'          
        '400':
          description: Invalid ID supplied
        '404':
          description: Movie not found
    put:
      tags:
        - Filmes
      summary: Atualiza um filme
      description: Atualiza um filme pelo seu ID
      parameters:
        - name: id
          in: path
          description: ID do filme para retorno
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados de atualização para o filme
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filmePut'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Movie not found
       
    delete:
      tags:
        - Filmes
      summary: Deleta um filme
      description: Excluir um filme
      parameters:
        - name: id
          in: path
          description: ID do filme para retorno
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
